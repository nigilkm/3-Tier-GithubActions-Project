# NOTE: for real use, create this via `kubectl create secret` or a secrets
# manager (Sealed Secrets, External Secrets, Vault) instead of committing
# base64 values to git. This file is illustrative for learning purposes only.
apiVersion: v1
kind: Secret
metadata:
  name: mongo-secret
  namespace: three-tier-app
type: Opaque
stringData:
  MONGO_INITDB_ROOT_USERNAME: admin
  MONGO_INITDB_ROOT_PASSWORD: changeme123
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: backend-config
  namespace: three-tier-app
data:
  PORT: "5000"
  MONGO_URI: "mongodb://admin:changeme123@mongo-service:27017/threetierdb?authSource=admin"
